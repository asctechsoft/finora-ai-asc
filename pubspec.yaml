name: finora
description: "ASC Finance AI — Talk. Track. Plan. Live."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path: ^1.9.0

  # State + routing
  get:

  # Local storage
  sqflite: ^2.4.2
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # UI
  fl_chart: ^0.70.2
  flutter_svg: ^2.2.3
  intl: ^0.20.2
  fluttertoast: ^9.0.0
  flutter_slidable: ^3.1.1

  # Voice capture
  speech_to_text: ^7.0.0
  permission_handler: ^12.0.1

  # Base package (internal)
  dsp_base:
    path: ./dsp_base

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  google_sign_in: ^6.2.2
  package_info_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/png/img_logo.png"
  min_sdk_android: 23
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/png/
    - assets/images/svg/
    - lib/xml_strings/values/
    - lib/xml_strings/values-vi/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic
